name: Atelier eleves - Mac Windows Linux
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parcours:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
      - if: always()
        run: node atelier.mjs arreter
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.os }}
          path: .atelier/
          include-hidden-files: true
          retention-days: 3
